[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "tracking-cellmot"
version = "0.1.0"
description = "Cell tracking utilities: I/O, metrics, and transformer-based edge prediction"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "BSD-3-Clause"
dependencies = [
    "tracksdata @ git+https://github.com/royerlab/tracksdata@main",
    "zarr>=3.0.10",
    "scipy",
    "tensorboard",
    "tqdm",
]

[project.optional-dependencies]
# Select exactly one CUDA build when syncing/running:
#   GTX 1080 Ti (Pascal, sm_61): uv sync --extra cu126
#   Newer GPUs:                  uv sync --extra cu130
cu126 = [
    "torch==2.14.0",
]
cu130 = [
    "torch==2.14.0",
]
dev = [
    "pytest>=8.4.2",
]
viz = [
    "napari>=0.5",
    "pyqt5",
]

[tool.uv]
conflicts = [
    [
        { extra = "cu126" },
        { extra = "cu130" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow — deselect with '-m \"not slow\"'",
]

[tool.ruff]
target-version = "py311"
src = ["src"]
line-length = 120

[tool.ruff.lint]
pydocstyle = { convention = "numpy" }
ignore = ["E712"]
select = [
    "E",    # style errors
    "W",    # style warnings
    "F",    # flakes
    "D417", # Missing argument descriptions in Docstrings
    "I",    # isort
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "B",    # flake8-bugbear
    "A001", # flake8-builtins
    "RUF",  # ruff-specific rules
    "TID",  # flake8-tidy-imports
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D", "S"]

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = false
